# Builds the Godot Web export and publishes it to GitHub Pages on every push
# to main. Enable once: Settings → Pages → Source: "GitHub Actions".
name: Deploy web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: "stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + web export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-web

      - name: Download Godot and web templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$T"
          unzip -q -j templates.tpz "templates/web_nothreads_*" "templates/version.txt" -d "$T"
          rm godot.zip templates.tpz

      - name: Import and export
        run: |
          mkdir -p build/web
          touch build/.gdignore
          ~/godot/godot --headless --path . --import || true
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      # GitHub Pages caches files for ~10 min. Give the big files a
      # per-commit name so a new deploy never mixes old and new files.
      - name: Version file names (cache busting)
        run: |
          V="${GITHUB_SHA::8}"
          cd build/web
          for f in index.js index.wasm index.pck index.audio.worklet.js index.audio.position.worklet.js; do
            [ -f "$f" ] && mv "$f" "index-$V${f#index}"
          done
          sed -i "s/\"executable\":\"index\"/\"executable\":\"index-$V\"/; s/\"index\.pck\"/\"index-$V.pck\"/; s/\"index\.wasm\"/\"index-$V.wasm\"/; s/src=\"index\.js\"/src=\"index-$V.js\"/" index.html
          grep -q "index-$V" index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
